name: Telemetry feed contract
on:
  push:
    branches: ['feature/aituber-feed-*', 'main']
  pull_request:
    paths: ['shared/**', 'tools/DonChanZombieRadar/**', 'src/**', 'tests/**', '.github/workflows/telemetry-feed.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test transport without game assemblies
        shell: powershell
        run: ./tests/run-feed-tests.ps1

      - name: Compile and test nearby observations without game assemblies
        shell: powershell
        run: ./tests/run-nearby-tests.ps1


      - name: Compile and test combat event policy
        shell: powershell
        run: ./tests/run-combat-tests.ps1
