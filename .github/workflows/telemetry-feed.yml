name: Telemetry feed contract
on:
  push:
    branches: ['feature/aituber-feed-*', 'main']
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/telemetry-feed.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test transport without game assemblies
        shell: powershell
        run: ./tests/run-feed-tests.ps1
